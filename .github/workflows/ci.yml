name: CI

on:
  push:
    branches: [main, master, 'refactor/**', 'release/**', 'perf/**', 'security/**']
  pull_request:

jobs:
  # P3 构建一致性 + 代码规范：确认 shotflow.html 与 src/ 源码一致，且 lint/format 无 error
  build-quality:
    name: 构建一致性与代码规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建产物一致性
        run: npm run verify:build
      - name: 部署注入安全回归
        run: npm run test:deploy
      - name: 版本号一致性
        run: npm run verify:version
      - name: ESLint
        run: npm run lint
      - name: Prettier 格式检查
        run: npm run format:check
      - name: 输出格式差异（仅在格式检查失败时）
        if: failure()
        run: |
          npx prettier --write 'scripts/*.mjs' eslint.config.js playwright.config.js
          git diff -- scripts eslint.config.js playwright.config.js

  # 纯逻辑测试：零依赖，Node 直接运行，作为最快的回归门禁
  logic:
    name: 核心逻辑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 运行逻辑测试（全部用例，数量以 RESULT 行为准）
        run: node tests/logic.test.mjs

  # 规模压测：数据层/模板层性能基准 + O(N²) 回归门禁（零依赖）
  perf:
    name: 规模压测与性能门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 运行规模压测（2000 分镜渲染须 < 50ms）
        run: node tests/perf.mjs

  # 部署副本一致性：防止源文件已改但 shotflow-app/ 未同步就合入
  sync-check:
    name: 部署副本一致性校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 校验 shotflow-app/ 与真源一致
        run: node scripts/sync-app.mjs --check

  # E2E 测试：浏览器端关键路径，按引擎矩阵跑 Chromium / Firefox / WebKit
  # （WebKit 为 Safari 内核的 Playwright 构建，不等于 macOS 上的 Safari 本体）
  e2e:
    name: E2E · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 ${{ matrix.browser }} 及系统依赖
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: 运行 E2E（${{ matrix.browser }}）
        run: npm run test:e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - name: 上传失败追踪（${{ matrix.browser }}）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
