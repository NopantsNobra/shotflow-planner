<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>瞬刻摄影工作台 · Stillmark｜灵感·分镜·提案·实拍</title>
<meta name="theme-color" content="#9c6b30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="瞬刻摄影工作台">
<meta name="description" content="瞬刻摄影工作台，给独立摄影师和小团队用的轻量策划小工具。从情绪板上的一缕灵感，到分镜表里的每一格画面，再到提案与拍摄日程，最后走进实拍现场——把一瞬间，刻成永恒画面。零散想法、参考图和执行细节稳稳收在一处；小项目一个接一个，慢慢沉淀成属于你的策划档案。">
<link rel="manifest" href="shotflow-manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F5F2EC; --surface:#FFFCF7; --surface-2:#FAF7F1;
  --ink:#2B2A27; --ink2:#6E6557; --ink3:#9C9389;
  --line:#E3DCD1; --line2:#D2C9BB;
  --accent:#9a6a33; --accent-ink:#7a5124; --accent-soft:#f3e9da;
  --red:#b23a2e; --green:#3c7a57; --blue:#3b6c9e; --purple:#7a5488;
  --radius:16px; --shadow-sm:0 1px 2px rgba(43,42,39,.05); --shadow:0 10px 26px -16px rgba(43,42,39,.30);
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC",Georgia,"Songti SC","Songti TC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(154,106,51,.12)}
svg{display:inline-block;vertical-align:middle}
.wrap{max-width:1180px;margin:0 auto;padding:26px 32px 100px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card h2{font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.muted{color:var(--ink2);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:500;letter-spacing:.01em;border:1px solid transparent;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn-primary{background:var(--ink);color:#fcf9f2;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:#2b251b}
.btn-ghost{border-color:var(--line);color:var(--ink2);background:transparent}
.btn-ghost:hover{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn-danger{border-color:#ead3ce;color:var(--red);background:transparent}
.btn-danger:hover{background:#fbf1ef}
.btn-sm{min-height:32px;padding:5px 11px;font-size:12.5px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;display:inline-block;letter-spacing:.02em}
.tag.red{background:#fbeae7;color:var(--red)} .tag.green{background:#e8f2eb;color:var(--green)}
.tag.blue{background:#eaf1f8;color:var(--blue)} .tag.gray{background:#f0ede6;color:var(--ink2)} .tag.purple{background:#f1eaf3;color:var(--purple)}
.iconbtn{color:#b3a997;padding:5px;border-radius:6px;display:inline-flex}
.iconbtn:hover{color:var(--red);background:#fbf1ef}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:11.5px;color:var(--ink2);background:var(--surface-2);min-height:30px}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fcf9f2}
.tagchip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:10.5px;white-space:nowrap}
.tagchip.on{background:var(--ink);color:#fcf9f2}
.tagchip.on button{color:#fcf9f2}
.tagchip button{color:inherit;padding:0 2px;font-size:11px;line-height:1;opacity:.65}
.tagchip button:hover{opacity:1;color:var(--red)}
.tag-cloud{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.tag-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.tag-filter input{max-width:260px;height:34px;font-size:13px}
.tag-editor{margin:10px 0 2px;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface-2)}
.tag-editor input{height:34px;font-size:13px}
.ref-tag{position:absolute;left:2px;right:2px;bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:8px;line-height:1.2;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}

/* 页头 / 指标 / 看板 */
.masthead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .eyebrow{font-size:10px;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase}
.brand h1{font-family:var(--serif);font-size:27px;line-height:1.2;font-weight:600;letter-spacing:.02em}
.brand .tagline{font-size:12px;color:var(--ink2);letter-spacing:.06em}
.masthead .sp{flex:1}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.metric{background:var(--surface);padding:16px 18px;display:flex;align-items:center;gap:12px}
.metric .mi{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.metric .mv{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.metric .ml{font-size:10.5px;color:var(--ink3);letter-spacing:.13em;margin-top:3px}
.metric.warn .mi{background:#fbf0ee;color:var(--red)}
.metric.warn .mv{color:var(--red)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.searchbox{position:relative;flex:1;min-width:240px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.searchbox input{height:42px;padding-left:38px;font-size:13.5px;border-radius:10px}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{height:34px;padding:0 14px;border-radius:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#fcf9f2}

.board{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 14px;align-items:flex-start;scroll-snap-type:x proximity}
.bcol{flex:1 0 218px;min-width:218px;max-width:300px;scroll-snap-align:start}
.bcol-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bcol-head .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex-shrink:0}
.bcol-head h3{font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--ink2)}
.bcol-head .count{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dot.st-0{background:#a8a094}.dot.st-1{background:var(--blue)}.dot.st-2{background:var(--red)}.dot.st-3{background:var(--purple)}.dot.st-4{background:var(--green)}
.bempty{padding:16px 2px;font-size:11px;color:var(--ink3);letter-spacing:.04em}

.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:10px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--shadow-sm);overflow:hidden}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.pcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.pcard.st-0::before{background:#bdb4a5}.pcard.st-1::before{background:var(--blue)}.pcard.st-2::before{background:var(--red)}.pcard.st-3::before{background:var(--purple)}.pcard.st-4::before{background:var(--green)}
.pcard .pname{font-size:14px;font-weight:600;line-height:1.45;letter-spacing:.01em;padding-left:4px}
.pcard .pmeta{font-size:11.5px;color:var(--ink3);margin-top:5px;padding-left:4px;line-height:1.5}
.pbar{height:3px;background:#efeade;border-radius:99px;margin:11px 0 0 4px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pcard .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-left:4px}
.pcard .pct{font-size:10.5px;color:var(--accent-ink);letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* 项目页 */
.phead{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:14px;padding:0;min-height:0;background:none;border:none}
.crumb:hover{color:var(--accent-ink)}
.phead-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.phead h1{font-family:var(--serif);font-size:27px;line-height:1.25;font-weight:600;letter-spacing:.015em}
.pchips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pactions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.metacard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px 16px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-bottom:6px}
.metacard input,.metacard select{background:var(--surface-2);border-color:transparent;height:40px;font-size:13.5px;border-radius:8px}
.metacard input:hover,.metacard select:hover{border-color:var(--line)}
.metacard .cityrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}

.ptabs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.ptab{position:relative;padding:10px 12px 12px;border:none;border-radius:0;background:none;color:var(--ink3);font-size:13.5px;min-height:auto;transition:color .15s}
.ptab:hover{color:var(--ink)}
.ptab.active{color:var(--ink);font-weight:600}
.ptab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.tab-group{font-size:10px;color:#a89c88;letter-spacing:.16em;margin:0 8px 0 12px}
.subbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin:-6px 0 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}

/* 情绪板 */
.mood-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-top:16px}
.mood-item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);position:relative;transition:box-shadow .18s,border-color .18s}
.mood-item:hover{border-color:var(--line2);box-shadow:var(--shadow-sm)}
.mood-item img{width:100%;height:118px;object-fit:cover;display:block}
.mood-item .mtext{padding:14px;font-size:12.5px;min-height:76px;color:var(--ink2);line-height:1.55}
.mood-item .mcolor{height:88px}
.mood-item .mfoot{padding:7px 12px;font-size:10.5px;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px}
.mood-item .del{position:absolute;top:8px;right:8px;background:rgba(20,17,12,.5);color:#fff;border-radius:7px;width:26px;height:26px;font-size:13px;opacity:0;transition:opacity .15s}
.mood-item:hover .del{opacity:1}
.mood-item .mfoot{flex-wrap:wrap;align-items:center}
.mfoot .tagchips{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.mfoot .tagchip{font-size:9.5px;padding:1px 6px}
.tag-rename{height:32px;max-width:240px}
.src-panel{margin-top:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.src-panel summary{cursor:pointer;font-size:12.5px;color:var(--ink2)}
.src-note{font-size:11.5px;color:var(--ink2);margin:8px 0}
.src-lic{font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-left:6px}
.src-list{display:grid;gap:7px;font-size:12px}
.src-list a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.src-words{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.src-words .chip{min-height:26px;padding:3px 9px;font-size:11px}
.src-sync{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px}

/* 参考图选择器 */
.ref-picker{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ref-group{margin-top:8px}
.ref-group-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:12px;color:var(--ink2)}
.ref-group-head .chips{display:flex;gap:5px;flex-wrap:wrap}
.ref-group-head .chip{min-height:24px;padding:2px 8px;font-size:10.5px}
.ref-group-head .chip.on{background:var(--ink);border-color:var(--ink);color:#fcf9f2}
.ref-opt{width:56px;height:56px;border-radius:9px;border:2px solid var(--line);overflow:hidden;cursor:pointer;position:relative;flex-shrink:0;transition:border-color .15s}
.ref-opt:hover{border-color:var(--line2)}
.ref-opt img{width:100%;height:100%;object-fit:cover;display:block}
.ref-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ref-opt .ord{position:absolute;top:2px;left:3px;background:var(--accent);color:#fff;font-size:10px;border-radius:5px;padding:0 4px}

/* 分镜表 */
.shot{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.shot:hover{border-color:var(--line2);box-shadow:var(--shadow-sm)}
.shot.done{background:var(--surface-2)}
.shot .refs{display:flex;flex-shrink:0}
.shot .refs img,.shot .refs .noref{width:54px;height:54px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2)}
.shot .refs img+img,.shot .refs .noref{margin-left:-14px}
.shot .refs .more{width:54px;height:54px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;display:flex;align-items:center;justify-content:center;margin-left:-14px;border:1px solid var(--line)}
.shot .noref-single{width:54px;height:54px;border-radius:8px;background:var(--surface-2);color:var(--ink3);font-size:10.5px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.chk{width:24px;height:24px;border:1.5px solid #cfc5b3;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface);margin-top:2px;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fcf9f2;font-size:14px}
.done-text{text-decoration:line-through;color:#b3a996}
.drag-handle{cursor:grab;color:#c9bfae;padding:8px 4px;touch-action:none;flex-shrink:0;border-radius:6px}
.drag-handle:active{cursor:grabbing;color:var(--accent)}
.shot.dragging{opacity:.45;border-color:var(--accent)}
.shot.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.shot.drop-after{box-shadow:0 3px 0 0 var(--accent)}

/* 日程时间轴 */
.sun-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sun-pill{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--ink2)}
.sun-pill b{font-family:var(--serif);font-size:15px;color:var(--accent-ink);margin-left:5px;font-variant-numeric:tabular-nums}
.tl-item{display:flex;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.tl-item:last-child{border-bottom:none}
.tl-time{width:100px;flex-shrink:0;font-size:12.5px;color:var(--ink2);padding-top:2px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tl-dot{width:7px;height:7px;border-radius:50%;margin-top:8px;flex-shrink:0}
.tl-body{flex:1;min-width:0}
.tl-title{font-weight:600;font-size:13.5px;line-height:1.5}
.tl-note{font-size:11.5px;color:var(--ink2);margin-top:3px}
.tl-item.shot-row .tl-title{color:var(--accent-ink)}

/* 预算 */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat-card .num{font-family:var(--serif);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-card .lbl{font-size:10.5px;color:var(--ink3);letter-spacing:.12em;margin-top:3px}
.amount-red{color:var(--red);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.brow{display:flex;gap:8px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.brow:last-child{border-bottom:none}

/* 协作 */
.note-item{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.note-item:last-child{border-bottom:none}
.note-kind{font-size:10.5px;padding:2px 8px;border-radius:999px;flex-shrink:0;margin-top:2px}
.note-time{font-size:10.5px;color:var(--ink3);white-space:nowrap;margin-top:3px;font-variant-numeric:tabular-nums}

/* 拍摄日模式 */
.sd-overlay{position:fixed;inset:0;background:#12100c;color:#f2ede3;z-index:200;display:none;overflow-y:auto}
.sd-overlay.show{display:block}
.sd-inner{max-width:620px;margin:0 auto;padding:18px 18px calc(44px + env(safe-area-inset-bottom))}
.sd-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sd-head h2{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.01em;flex:1;min-width:120px}
.sd-nav{width:40px;height:40px;border-radius:10px;border:1px solid #34302a;color:#cbbda4;font-size:17px;background:#1a1712}
.sd-progress{height:4px;background:#2c2822;border-radius:99px;margin:12px 0 8px}
.sd-progress i{display:block;height:100%;background:#d9a55f;border-radius:99px;transition:width .3s}
.sd-sun{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;color:#a99e8c;margin-bottom:16px;letter-spacing:.03em}
.sd-sun span{background:#1a1712;border:1px solid #2c2822;border-radius:99px;padding:3px 10px}
.sd-slot{font-size:10.5px;color:#a99e8c;letter-spacing:.18em;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sd-slot .now{background:#d9a55f;color:#12100c;padding:2px 10px;border-radius:99px;font-weight:700;letter-spacing:.08em}
.sd-shot{background:#1a1712;border:1px solid #2c2822;border-radius:14px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.sd-shot.now{border-color:#d9a55f;background:#221c13}

function cvNo(p){
  const d=(p&&p.createdAt)?new Date(p.createdAt):new Date();
  const bad=isNaN(d.getTime());
  const y=bad?new Date().getFullYear():d.getFullYear();
  const m=bad?new Date().getMonth()+1:d.getMonth()+1;
  return 'NO. '+y+'-'+String(m).padStart(2,'0');
}
function cvDate(s){
  if(!s) return '待定';
  const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+'.'+m[2].padStart(2,'0')+'.'+m[3].padStart(2,'0'):String(s);
}
function coverData(p){
  const c=(p&&p.concept)||{};
  return {no:cvNo(p),title:(p&&p.name)||'摄影策划案',theme:c.theme||'待定',model:c.model||'待定',date:cvDate(p&&p.shootDate),studio:(p&&p.studio)||'瞬刻摄影工作室 · STUDIO',est:'EST. '+new Date().getFullYear()};
}
function fitCovers(){
  document.querySelectorAll('.cv-fit').forEach(fit=>{
    const sheet=fit.querySelector('.cv-sheet'); if(!sheet) return;
    const parent=fit.parentElement;
    const avail=fit.clientWidth||(parent?parent.clientWidth:0)||1080;
    const s=Math.min(avail/1080,1);
    sheet.style.transform='scale('+s+')';
    fit.style.height=Math.round(1620*s)+'px';
    fit.querySelectorAll('[data-cv-fit]').forEach(el=>{
      const base=parseInt(el.getAttribute('data-cv-fit'),10)||24;
      let fs=base; el.style.fontSize=fs+'px';
      while(fs>24&&el.scrollWidth>el.clientWidth+2){fs-=4;el.style.fontSize=fs+'px';}
    });
  });
}
function coverHtml(p){

/* ===== 素材标签纯函数层：只依赖内置对象，可被逻辑测试直接抽取 ===== */
function tagKey(s){
  return String(s==null?'':s).normalize('NFKC').trim().toLocaleLowerCase('en-US').replace(/\s+/g,' ');
}
function dedupeTags(list){
  if(!Array.isArray(list)) return [];
  const seen=new Set(), out=[];
  list.forEach(v=>{
    const t=String(v==null?'':v).trim(), k=tagKey(t);
    if(!k||seen.has(k)) return;
    seen.add(k); out.push(t);
  });
  return out;
}
function parseTagsInput(str){
  return dedupeTags(String(str==null?'':str).split(/[,，;；]+/));
}
function mergeVocab(vocab,list){
  return dedupeTags([...(Array.isArray(vocab)?vocab:[]),...(Array.isArray(list)?list:[])]);
}
function migrateTags(p){
  if(!p||typeof p!=='object') return p;
  p.mood=Array.isArray(p.mood)?p.mood:[];
  p.tagVocab=dedupeTags(p.tagVocab);
  p.mood.forEach(m=>{
    if(!m||typeof m!=='object') return;
    m.tags=dedupeTags(Array.isArray(m.tags)?m.tags:(m.tag?[m.tag]:[]));
  });
  p.tagVocab=mergeVocab(p.tagVocab,p.mood.flatMap(m=>(m&&m.tags)||[]));
  return p;
}
function tagsForDisplay(m){
  if(!m||typeof m!=='object') return [];
  return Array.isArray(m.tags)&&m.tags.length?m.tags:(m.tag?[m.tag]:[]);
}
function matchByTags(item,filter,mode){
  const keys=dedupeTags(Array.isArray(filter)?filter.map(tagKey):[]);
  if(!keys.length) return true;
  const tags=tagsForDisplay(item).map(tagKey);
  return mode==='all'?keys.every(k=>tags.includes(k)):keys.some(k=>tags.includes(k));
}
function renameTag(p,from,to){
  if(!p||typeof p!=='object') return p;
  const next=String(to==null?'':to).trim(), fk=tagKey(from);
  if(!fk||!tagKey(next)) return p;
  p.mood=Array.isArray(p.mood)?p.mood:[];
  p.mood.forEach(m=>{
    if(!m||typeof m!=='object') return;
    m.tags=dedupeTags(tagsForDisplay(m).map(t=>tagKey(t)===fk?next:t));
    m.tag=m.tags[0]||'';
  });
  const vocab=Array.isArray(p.tagVocab)?p.tagVocab:[];
  p.tagVocab=mergeVocab(vocab.map(t=>tagKey(t)===fk?next:t),[next]);
  return p;
}
function removeTag(p,tag){
  if(!p||typeof p!=='object') return p;
  const k=tagKey(tag); if(!k) return p;
  p.mood=Array.isArray(p.mood)?p.mood:[];
  p.mood.forEach(m=>{
    if(!m||typeof m!=='object') return;
    m.tags=dedupeTags(tagsForDisplay(m).filter(t=>tagKey(t)!==k));
    if(tagKey(m.tag)===k) m.tag='';
  });
  const vocab=Array.isArray(p.tagVocab)?p.tagVocab:[];
  p.tagVocab=dedupeTags(vocab.filter(t=>tagKey(t)!==k));
  return p;
}

/* ===== 姿势图库纯函数层：只做 catalog 映射、diff 与游标计算，不碰 DOM/idb ===== */
function shiseiItemKey(e){
  if(e&&e.key) return String(e.key);
  return 'shisei:'+String((e&&e.pid)||'')+':'+String((e&&e.view)||'');
}
function parseCatalog(raw){
  const list=Array.isArray(raw)?raw:(Array.isArray(raw&&raw.items)?raw.items:[]);
  const views=['front','diag','side','above','below'], out=[];
  (list||[]).forEach(e=>{
    if(!e||!e.id) return;
    views.forEach(v=>{
      const file=(e.views&&e.views[v])||(e.maps&&e.maps[v]);
      if(!file) return;
      out.push({pid:String(e.id),cat:String(e.class_cn||e.class_en||'未分类'),view:v,
        zh:String(e.name_cn||e.name_en||e.id),en:String(e.name_en||e.name_cn||''),ja:String(e.name_jp||''),
        url:'images/line/w300/'+String(file).replace(/^\/+/,'')});
    });
  });
  return out;
}
function shiseiEntrySame(a,b){
  return String((a&&a.cat)||'')===String((b&&b.cat)||'')
    &&String((a&&a.zh)||'')===String((b&&b.zh)||'')
    &&String((a&&a.en)||'')===String((b&&b.en)||'')
    &&String((a&&a.ja)||'')===String((b&&b.ja)||'')
    &&String((a&&a.url)||'')===String((b&&b.url)||'');
}
function diffCatalog(localEntries,remoteEntries){
  const local=Array.isArray(localEntries)?localEntries:[], remote=Array.isArray(remoteEntries)?remoteEntries:[];
  const lm=new Map(local.map(e=>[shiseiItemKey(e),e])), rm=new Map(remote.map(e=>[shiseiItemKey(e),e]));
  const toAdd=[],toUpdate=[];
  remote.forEach(e=>{ const k=shiseiItemKey(e), old=lm.get(k);
    if(!old) toAdd.push(e);
    else if(!shiseiEntrySame(old,e)) toUpdate.push(e);
  });
  const toRemove=[];
  local.forEach(e=>{ const k=shiseiItemKey(e); if(!rm.has(k)) toRemove.push(k); });
  return {toAdd,toUpdate,toRemove};
}
function nextPendingBatch(meta,batch){
  const size=Math.max(1,Math.trunc(+batch||0)||1);
  const pending=(meta&&Array.isArray(meta.pending))?meta.pending:[];
  const cursor=Math.max(0,Math.trunc((meta&&meta.cursor)||0));
  const items=pending.slice(cursor,cursor+size).map(x=>typeof x==='string'?{key:x}:x);
  const next=cursor+items.length;
  return {items,cursor:next,done:next>=pending.length};
}
function mergeShiseiMeta(meta,patch){
  const base=(meta&&typeof meta==='object')?meta:{};
  return Object.assign({},base,(patch&&typeof patch==='object')?patch:{});
}

/* v3 数据迁移：旧项目补齐新字段 */
function migrate(p){
  p.mood=p.mood||[]; p.scenes=p.scenes||[]; p.shots=p.shots||[]; p.items=p.items||[]; p.budget=p.budget||[];
  p.schedule=p.schedule||[]; p.notes=p.notes||[]; p.todos=p.todos||[];
  p.concept=p.concept||{theme:'',style:'',audience:'',usage:'',note:'',model:''};
  if(p.concept.model===undefined) p.concept.model='';
  p.shots.forEach(s=>{
    if(s.refId!==undefined&&!s.refIds) s.refIds=s.refId?[s.refId]:[];
    s.refIds=s.refIds||[]; delete s.refId;
    if(s.duration==null) s.duration=20;
    if(s.ord==null) s.ord=0;
  });
  p.schedule.forEach(n=>{ n.done=!!n.done; });
  migrateTags(p);
  return p;
}
/* 内存缓存 + 异步持久化：UI 层仍同步读 loadP()，写通过 saveP() 合并后落 IndexedDB */
let projectsCache=null, persistTimer=null;
function loadP(){ if(!projectsCache) projectsCache=[]; return projectsCache; }
function saveP(a){
  projectsCache=a;
  clearTimeout(persistTimer);
  persistTimer=setTimeout(()=>{
    idb.putProjects(projectsCache).catch(()=>toast('保存失败，请立即导出备份'));
  },200);
}
async function initData(){
  await idb.open();
  let arr=null;
  try{ arr=await idb.getProjects(); }catch(e){}
  let migrated=false;
  if(Array.isArray(arr)){
    migrated=arr.some(p=>!p.v3);
    projectsCache=arr.map(p=>{ migrate(p); p.v3=1; return p; });
  } else {
    try{ arr=JSON.parse(localStorage.getItem(LS_PROJ))||[]; }catch(e){ arr=[]; }
    projectsCache=arr.map(p=>{ migrate(p); p.v3=1; return p; });
    migrated=true;
  }
  await idb.putProjects(projectsCache);
  try{ localStorage.removeItem(LS_PROJ); }catch(e){}
  return migrated;
}

/* ================= 太阳时间（NOAA 近似算法） ================= */
function sunTimes(dateStr,lat,lng){
  if(!dateStr||lat==null||lng==null||lat===''||lng==='') return null;
  const latN=parseFloat(lat), lngN=parseFloat(lng);
  if(isNaN(latN)||isNaN(lngN)) return null;
  const d=new Date(dateStr+'T12:00:00');
  const N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  const g=2*Math.PI/365*(N-1+0.5);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const latR=latN*Math.PI/180;
  const cosHa=Math.cos(90.833*Math.PI/180)/(Math.cos(latR)*Math.cos(dec))-Math.tan(latR)*Math.tan(dec);
  if(cosHa>1||cosHa<-1) return null;
  const ha=Math.acos(cosHa)*180/Math.PI;
  const tzOff=-new Date().getTimezoneOffset();
  const fmt=m=>{ m=((m+tzOff)%1440+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0'); };
  const sunrise=720-4*(lngN+ha)-eq, sunset=720-4*(lngN-ha)-eq, noon=720-4*lngN-eq;
  return {sunrise:fmt(sunrise),noon:fmt(noon),sunset:fmt(sunset),goldenStart:fmt(sunset-75),goldenEnd:fmt(sunset)};
}

function renderMoodGrid(p){
  p=p||cur(); if(!p) return;
  const all=Array.isArray(p.mood)?p.mood:[];
  const freq=new Map(), order=new Map(); let seq=0;
  const touch=(key,label)=>{
    if(!key) return;
    if(!order.has(key)) order.set(key,seq++);
    if(!freq.has(key)) freq.set(key,{key,label,count:0});
    freq.get(key).count++;
  };
  all.forEach(m=>tagsForDisplay(m).forEach(t=>touch(tagKey(t),t)));
  (Array.isArray(p.tagVocab)?p.tagVocab:[]).forEach(t=>touch(tagKey(t),t));
  const cloud=[...freq.values()].sort((a,b)=>b.count-a.count||order.get(a.key)-order.get(b.key));
  const active=new Set(view.moodFilter.map(tagKey));
  document.getElementById('tagCloud').innerHTML=cloud.length?cloud.map(x=>
      '<span class="tagchip'+(active.has(x.key)?' on':'')+'">#'+esc(x.label)+' ×'+x.count
      +'<button title="按此标签筛选" onclick="toggleMoodFilterKey('+jstr(x.key)+')">'+(active.has(x.key)?'✓':'筛')+'</button>'
      +'<button title="重命名标签" onclick="startRenameTag('+jstr(x.label)+')">✎</button>'
      +'<button title="删除标签" onclick="delTagFromVocab('+jstr(x.label)+')">×</button></span>').join('')
    :'<span class="muted">还没有标签。可在上方输入框添加，或从下方常用词里点选。</span>';
  const filtered=all.filter(m=>matchByTags(m,view.moodFilter,view.moodFilterMode));
  const countEl=document.getElementById('moodCount'); if(countEl) countEl.textContent=filtered.length+'/'+all.length+' 张';
  const filterInput=document.getElementById('m_filter');
  const filterText=view.moodFilter.join(', ');
  if(filterInput&&filterInput.value!==filterText) filterInput.value=filterText;
  const grid=document.getElementById('moodGrid'); if(!grid) return;
  let html='';
  if(!all.length){
    html='<p class="muted" style="grid-column:1/-1">还没有素材。上传图片 / 写文字 / 取色彩时可在「标签」框输入，逗号分隔（如：逆光, 中景, 回眸）。</p>';
  } else if(!filtered.length){
    html='<p class="muted" style="grid-column:1/-1">没有命中所选标签的素材，换个标签或清空筛选。</p>';
  } else {
    html=filtered.map(m=>{
      let body='';
      if(m.type==='image') body='<img src="'+esc(imgCache[m.content]||'')+'">';
      else if(m.type==='color') body='<div class="mcolor" style="background:'+esc(m.content)+'"></div>';
      else body='<div class="mtext">'+esc(m.content)+'</div>';
      const tags=tagsForDisplay(m);
      const chips=tags.length?tags.map(t=>'<button class="tagchip" title="编辑标签" onclick="openTagEditor('+jstr(m.id)+')">#'+esc(t)+'</button>').join(''):'<span class="muted">无标签</span>';
      const suggest=(m.autoTags&&m.autoTags.length)?'<button class="tagchip" onclick="applyAiSuggestion('+jstr(m.id)+')">采纳建议</button>':'';
      return '<div class="mood-item">'+body+'<button class="del" onclick="delMood('+jstr(m.id)+')">×</button>'
        +'<div class="mfoot"><span class="tagchips">'+chips+'</span>'+suggest
        +'<button class="iconbtn" title="编辑标签" onclick="openTagEditor('+jstr(m.id)+')">✎</button></div></div>';
    }).join('');
  }
  grid.innerHTML=html;
}

function addMoodImg(e){
  const f=e.target.files[0]; if(!f) return;
  const tagInput=gv('m_tag'), tags=parseTagsInput(tagInput);   // 异步前同步读取，避免压缩期间切页丢输入
  const rd=new FileReader();
  rd.onload=ev=>{ const img=new Image();
    img.onload=async()=>{
      const c=document.createElement('canvas'); const s=Math.min(1,800/img.width);
      c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const imgId=uid(); const data=c.toDataURL('image/jpeg',.72);
      await idb.put(imgId,data); imgCache[imgId]=data;
      updateCur(p=>{
        p.mood.push({id:uid(),type:'image',content:imgId,tag:tags[0]||'',tags});
        p.tagVocab=mergeVocab(p.tagVocab,tags);
      });
      renderProject();
    }; img.src=ev.target.result; };
  rd.readAsDataURL(f); e.target.value='';
}

/* 拖拽排序（桌面 + 触屏，Pointer Events） */
function attachDrag(){
  const list=document.getElementById('shotList'); if(!list) return;
  list.querySelectorAll('.drag-handle').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      const dragEl=h.closest('.shot'); const startY=e.clientY; let active=false;
      h.setPointerCapture(e.pointerId);
      const move=ev=>{
        if(!active && Math.abs(ev.clientY-startY)>6){ active=true; dragEl.classList.add('dragging'); }
        if(!active) return;
        list.querySelectorAll('.shot').forEach(s=>s.classList.remove('drop-before','drop-after'));
        const t=document.elementFromPoint(ev.clientX,ev.clientY);
        const target=t&&t.closest?t.closest('.shot'):null;
        if(target&&target!==dragEl){
          const r=target.getBoundingClientRect();
          const after=(ev.clientY-r.top)>r.height/2;
          target.classList.add(after?'drop-after':'drop-before');
          dragEl._drop={el:target,after};
        } else dragEl._drop=null;
      };
      const up=()=>{
        h.removeEventListener('pointermove',move);
        h.removeEventListener('pointerup',up);
        h.removeEventListener('pointercancel',up);
        const info=dragEl._drop;
        if(active&&info){
          if(info.after) info.el.after(dragEl); else info.el.before(dragEl);
          persistOrder(list,dragEl.dataset.id);
        } else {
          list.querySelectorAll('.shot').forEach(s=>s.classList.remove('dragging','drop-before','drop-after'));
        }
      };
      h.addEventListener('pointermove',move);
      h.addEventListener('pointerup',up);
      h.addEventListener('pointercancel',up);
    });
  });
}
function persistOrder(list,draggedId){
  const ids=[...list.querySelectorAll('.shot')].map(el=>el.dataset.id);
  updateCur(p=>{
    const byId={}; p.shots.forEach(s=>byId[s.id]=s);
    const i=ids.indexOf(draggedId);
    let adopt=null;
    if(i<ids.length-1) adopt=byId[ids[i+1]].date;
    else if(i>0) adopt=byId[ids[i-1]].date;
    if(adopt!=null&&adopt!=='') byId[draggedId].date=adopt;
    const counters={};
    ids.forEach(id=>{ const s=byId[id]; const d=s.date||''; counters[d]=(counters[d]||0); s.ord=counters[d]++; });
  });
  renderProject();
}

function addMin(hhmm,m){ const [h,mi]=hhmm.split(':').map(Number); const t=(h*60+mi+m+1440)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
/* 时间统一模型：分镜与流程节点都派生出 start/end，冲突即前一事项未结束下一事项已开始 */
function toMin(t){ const m=/^(\d{1,2}):(\d{2})$/.exec(t||''); return m?(+m[1])*60+(+m[2]):1440; }
function fmtMin(m){ m=Math.max(0,Math.min(1439,Math.round(m))); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function dayItems(p,date){
  const out=[];
  (p.shots||[]).filter(s=>s.date===date).forEach(s=>{
    const st=toMin(s.slot), dur=Math.max(5,+s.duration||20);
    out.push({...s,_t:'shot',_start:st,_end:st+dur,_time:s.slot||''});
  });
  (p.schedule||[]).filter(n=>(n.date||date)===date&&n.start).forEach(n=>{
    const st=toMin(n.start), raw=toMin(n.end||addMin(n.start,30));
    out.push({...n,_t:'node',_start:st,_end:raw>st?raw:st+30,_time:n.start});
  });
  out.sort((a,b)=>a._start-b._start||a._end-b._end);
  let prevEnd=-1;
  out.forEach(it=>{ it._conflict=it._start<prevEnd; if(it._end>prevEnd) prevEnd=it._end; });
  return out;
}
/* 级联顺延：被点事项及其后所有事项后移，后一项不早于前一项结束 */
function cascadeShift(p,date,id,delta){
  const items=dayItems(p,date);
  const idx=items.findIndex(x=>x.id===id); if(idx<0) return 0;
  const base=items[idx]._start;
  const plan=[]; let cursor=-1;
  items.forEach(it=>{
    const dur=it._t==='shot'?Math.max(5,+it.duration||20):Math.max(30,it._end-it._start);
    if(it._start<base){ if(it._end>cursor) cursor=it._end; return; }
    let ns=it._start+delta;
    if(cursor>=0&&ns<cursor) ns=cursor;
    plan.push({it,ns,dur});
    cursor=ns+dur;
  });
  if(plan.some(x=>x.ns+x.dur>1440)) return -1;
  let moved=0;
  plan.forEach(({it,ns,dur})=>{
    if(it._t==='shot'){
      const s=p.shots.find(z=>z.id===it.id);
      if(s&&s.slot){ s.slot=fmtMin(ns); moved++; }
    } else {
      const n=p.schedule.find(z=>z.id===it.id);
      if(n&&n.start){ n.start=fmtMin(ns); n.end=fmtMin(ns+dur); moved++; }
    }
  });
  return moved;
}
function timelineHtml(p,date){
  const items=dayItems(p,date);
  if(!items.length) return '<p class="muted">这一天还没有安排。添加流程环节，或在分镜表里给分镜定日期。</p>';
  const conflictN=items.filter(x=>x._conflict).length;
  let h=conflictN?'<div class="backup-tip show" style="margin-bottom:12px">检测到 '+conflictN+' 处时间重叠，后续事项与前一项未结束的时间相交。</div>':'';
  h+=items.map(it=>{
    const time=it._t==='shot'?(it._time||'未排时'):(it.start||'')+(it.end?' – '+it.end:'');
    const cflag=it._conflict?' <span class="tag red">时间重叠</span>':'';

        +'<button class="chk '+(it.done?'on':'')+'" onclick="toggleShot(\''+it.id+'\')">'+(it.done?'✓':'')+'</button></div>';
    }
    return '<div class="tl-item"><div class="tl-time">'+esc(time)+'</div><div class="tl-dot" style="background:'+(it.type==='拍摄'?'var(--accent)':'#b4b2a9')+'"></div>'

  return h;

/* ================= 拍摄日模式 ================= */
let sdDate=null;
function openShootDay(){ const p=cur(); sdDate=p.shootDate||todayStr(); renderShootDay(); document.getElementById('sdOverlay').classList.add('show'); }
function closeShootDay(){ document.getElementById('sdOverlay').classList.remove('show'); renderProject(); }
function sdSetDate(d){ sdDate=d; renderShootDay(); }
async function renderShootDay(){
  const p=cur(); if(!p) return;
  await ensureShiseiRefs(p);
  const shots=p.shots.filter(s=>s.date===sdDate);
  const items=dayItems(p,sdDate);
  const done=items.filter(x=>x.done).length;
  const now=new Date(); const nowT=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const isToday=sdDate===todayStr();
  let currentId=null;
  if(isToday){ items.forEach(x=>{ if(!x.done&&(x._time||'00:00')<=nowT) currentId=x.id; }); if(!currentId){ const nxt=items.find(x=>!x.done); if(nxt) currentId=nxt.id; } }
  const sun=sunTimes(sdDate,p.lat,p.lng);
  let h='<div class="sd-head"><h2>'+esc(p.name)+'</h2>'
    +'<button class="sd-nav" onclick="sdShift(-1)" title="前一天">‹</button>'
    +'<input type="date" value="'+sdDate+'" onchange="sdSetDate(this.value)" style="background:#221e18;color:#f0ebe2;border-color:#3a342b;max-width:150px">'
    +'<button class="sd-nav" onclick="sdShift(1)" title="后一天">›</button>'
    +'<button class="sd-btn" onclick="closeShootDay()">退出</button></div>'
    +'<div class="muted" style="color:#a99e8c">拍摄日模式 · 完成 '+done+'/'+items.length+'</div>'
    +'<div class="sd-progress"><i style="width:'+(items.length?done/items.length*100:0)+'%"></i></div>';
  if(sun) h+='<div class="sd-sun"><span>日出 '+sun.sunrise+'</span><span>黄金 '+sun.goldenStart+'</span><span>日落 '+sun.sunset+'</span><span>暮光 '+addMin(sun.sunset,30)+'</span></div>';
  if(!items.length){ h+='<div class="sd-empty">这一天没有安排。<br>回日程页添加流程，或切换上方日期。</div>'; }
  else{
    let lastT='';
    items.forEach(x=>{
      const time=x._time||'未排时';
      if(time!==lastT){ lastT=time;
        h+='<div class="sd-slot">◷ '+time+(x.id===currentId?' <span class="now">当前</span>':'')+'</div>'; }
      const overdue=isToday&&!x.done&&time<nowT&&x.id!==currentId&&time!=='未排时';
      const cflag=x._conflict?' <span class="tag red" style="border:1px solid #a32d2d">重叠</span>':'';
      if(x._t==='shot'){
        const scene=p.scenes.find(s=>s.id===x.sceneId);
        const refs=(x.refIds||[]).filter(r=>imgCache[r]||String(r||'').startsWith('shisei:'));
        h+='<div class="sd-shot '+(x.done?'done':'')+' '+(x.id===currentId?'now':'')+'">'
          +(refs.length?refs.map(r=>imgCache[r]?'<img src="'+esc(imgCache[r])+'">':'<div style="width:68px;height:68px;border-radius:9px;border:1px solid #2c2822;background:#12100c;color:#a99e8c;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px">图库原图已更新</div>').join(''):'')
          +'<div style="flex:1;min-width:120px"><div class="sd-name">'+esc(x.name)+cflag+'</div>'
          +'<div class="sd-meta">'+(scene?esc(scene.name)+' · ':'')+'约 '+x.duration+' 分钟'+(x.note?' · '+esc(x.note):'')+'</div>'
          +((overdue||x._conflict)?'<button class="sd-btn" style="margin-top:8px" onclick="sdPostpone(\''+x.id+'\')">顺延后续 1 小时</button>':'')
          +'</div>'
          +'<button class="sd-chk '+(x.done?'on':'')+'" onclick="sdToggle(\''+x.id+'\')">✓</button></div>';
      } else {
        h+='<div class="sd-shot node '+(x.done?'done':'')+' '+(x.id===currentId?'now':'')+'">'
          +'<div style="flex:1;min-width:120px"><div class="sd-name" style="font-size:16px">'+esc(x.title)+cflag+'</div>'
          +'<div class="sd-meta">'+esc(x.type)+(x.end?' · 至 '+x.end:'')+(x.note?' · '+esc(x.note):'')+'</div></div>'
          +'<button class="sd-chk sm '+(x.done?'on':'')+'" onclick="sdToggleNode(\''+x.id+'\')">✓</button></div>';
      }
    });
  }
  document.getElementById('sdBody').innerHTML=h;
}
function sdShift(d){ const dt=new Date(sdDate+'T12:00:00'); dt.setDate(dt.getDate()+d); sdDate=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); renderShootDay(); }
function sdToggle(id){ updateCur(p=>{const s=p.shots.find(x=>x.id===id); if(s) s.done=!s.done;}); renderShootDay(); }
function sdToggleNode(id){ updateCur(p=>{const n=p.schedule.find(x=>x.id===id); if(n) n.done=!n.done;}); renderShootDay(); }
function sdPostpone(id){
  let overflow=false;
  updateCur(p=>{ if(cascadeShift(p,sdDate,id,60)===-1) overflow=true; });
  if(overflow) toast('顺延后超出当天 24:00，请先改到次日'); else toast('后续事项已顺延并避开重叠');
  renderShootDay();
}

function downloadData(data,filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=filename; a.click();
}
function collectImages(ps){
  const ids=new Set();
  ps.forEach(p=>{
    (p.mood||[]).filter(m=>m.type==='image').forEach(m=>ids.add(m.content));
    (p.shots||[]).forEach(s=>(s.refIds||[]).forEach(r=>{ if(!String(r||'').startsWith('shisei:')) ids.add(r); }));
  });
  return ids;
}
async function imagesFor(ps){
  const out={};
  for(const id of collectImages(ps)){ const v=(imgCache[id]||await idb.get(id)); if(v) out[id]=v; }
  return out;
}
async function exportJSON(){
  const data={app:'stillmark',version:4,exportedAt:new Date().toISOString(),projects:loadP(),images:await imagesFor(loadP())};

  downloadData({app:'stillmark',version:4,type:'project',exportedAt:new Date().toISOString(),project:p,images:await imagesFor([p])},

let pendingImport=null;
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=ev=>{
    let d;
    try{ d=JSON.parse(ev.target.result); }catch(err){ toast('文件格式不正确，导入失败'); e.target.value=''; return; }
    const list=d.projects?d.projects:(d.project?[d.project]:null);
    if(!list||!list.length){ toast('文件中没有可导入的策划案'); e.target.value=''; return; }
    pendingImport=d;
    const names=list.slice(0,3).map(p=>p.name||'未命名').join('、')+(list.length>3?' 等':'');
    if(d.type==='project'||d.project){
      askConfirm('导入为新的策划案？','将新增 1 个策划案「'+(list[0].name||'未命名')+'」，不会覆盖现有数据。',applyImport);
    } else {
      askConfirm('导入将覆盖全部数据？','文件含 '+list.length+' 个策划案：'+names+'。此操作会替换当前全部数据，不可撤销；建议先导出备份。',applyImport);
    }
  };
  rd.readAsText(f); e.target.value='';
}
async function applyImport(){
  const d=pendingImport; if(!d){ return; }
  try{
    let arr;
    if(d.type==='project'||d.project){
      const p=migrate(d.project); delete p.v3; p.v3=1; p.id=uid(); p.name=(p.name||'导入的策划案')+'（导入）';
      arr=[...loadP(),p];
    } else {
      arr=d.projects.map(p=>{ migrate(p); p.v3=1; return p; });
    }
    if(d.images){ for(const k of Object.keys(d.images)){ await idb.put(k,d.images[k]); imgCache[k]=d.images[k]; } }
    saveP(arr);
    view={mode:'board',pid:null,tab:'shots',moodFilter:[],moodFilterMode:'any'}; renderBoard(); toast('导入成功，共 '+arr.length+' 个策划案');
  }catch(err){ toast('导入失败：数据格式或图片异常'); }
  finally{ pendingImport=null; }
}

/* ===== shisei 姿势图库：空闲自动同步（零密钥，只用公开 CDN） ===== */
const SHISEI_CATALOG_URL='https://cdn.jsdelivr.net/gh/wquguru/shisei@main/data/catalog.json';
const SHISEI_CDN_BASE='https://cdn.jsdelivr.net/gh/wquguru/shisei@main/';
const SHISEI_META_KEY='catalog', SHISEI_SYNC_INTERVAL=24*60*60*1000, SHISEI_BATCH=3;
let shiseiInitReady=false, shiseiCat='全部';
let shiseiState={running:false,paused:false,total:0,done:0};
function shiseiSyncEnabled(){
  try{ return localStorage.getItem('wb_sf_shisei_sync')!=='0'; }catch(e){ return true; }
}
function shiseiCanStart(force){
  if(!shiseiInitReady||!shiseiSyncEnabled()||!navigator.onLine) return false;
  if(!force&&document.visibilityState!=='visible') return false;
  if(document.querySelector('.modal-mask.show')||document.getElementById('sdOverlay').classList.contains('show')) return false;
  return true;
}
function shiseiCatalogVersion(text){
  const s=String(text||''); let h=5381;
  for(let i=0;i<s.length;i++) h=(((h<<5)+h)+s.charCodeAt(i))>>>0;
  return s.length+'-'+h.toString(36);
}
function fetchShiseiWithTimeout(url,ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{signal:ctrl.signal,mode:'cors'}).finally(()=>clearTimeout(timer));
}
function shiseiBlobToDataURL(blob){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(String(rd.result||''));
    rd.onerror=()=>rej(rd.error||new Error('BLOB_READ_FAILED'));
    rd.readAsDataURL(blob);
  });
}
async function fetchShiseiImage(entry){
  let lastErr=null;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const r=await fetchShiseiWithTimeout(SHISEI_CDN_BASE+String(entry.url||'').replace(/^\/+/,''),20000);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data=await shiseiBlobToDataURL(await r.blob());
      if(!data) throw new Error('EMPTY_IMAGE');
      return data;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('IMAGE_FETCH_FAILED');
}
function startShiseiSync(force){
  if(shiseiState.running) return;
  const schedule=window.requestIdleCallback?window.requestIdleCallback:cb=>setTimeout(cb,5000);
  schedule(async()=>{
    if(!shiseiCanStart(!!force)) { renderShiseiSyncStatus(); return; }
    try{
      const meta=await idb.getShiseiMeta(SHISEI_META_KEY);
      if(!force&&meta&&meta.failStreak>=3) return;
      const resumable=meta&&Array.isArray(meta.pending)&&meta.pending.length&&meta.cursor>0;
      if(!force&&meta&&meta.checkedAt&&!resumable&&Date.now()-meta.checkedAt<SHISEI_SYNC_INTERVAL) return;
      await runShiseiSync(!!force);
    }catch(e){ renderShiseiSyncStatus(); }
  });
}
async function runShiseiSync(force){
  if(shiseiState.running||(!force&&!shiseiSyncEnabled())) return;
  shiseiState={running:true,paused:false,total:0,done:0};
  renderShiseiSyncStatus();
  try{
    const r=await fetchShiseiWithTimeout(SHISEI_CATALOG_URL,15000);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    const raw=JSON.parse(text);
    const remote=parseCatalog(raw), version=shiseiCatalogVersion(text);
    const local=await idb.shiseiIndex();
    const diff=diffCatalog(local,remote);
    for(const k of diff.toRemove){ await idb.delShiseiImg(k); if(imgCache[k]) delete imgCache[k]; }
    const remoteByKey=new Map(remote.map(e=>[shiseiItemKey(e),e]));
    let meta=await idb.getShiseiMeta(SHISEI_META_KEY);
    let pending=diff.toAdd.concat(diff.toUpdate).map(shiseiItemKey);
    let cursor=0;
    if(meta&&meta.version===version&&Array.isArray(meta.pending)&&meta.pending.length
      &&meta.pending.join('|')===pending.join('|')&&meta.cursor>0){
      pending=meta.pending; cursor=Math.min(meta.cursor,pending.length);
    }
    meta=mergeShiseiMeta(meta||{},{
      version,fetchedAt:Date.now(),checkedAt:Date.now(),total:remote.length,
      pending,cursor,failStreak:0,paused:false
    });
    await idb.putShiseiMeta(SHISEI_META_KEY,meta);
    if(!pending.length){ await finishShiseiSync(meta); return; }
    shiseiState.total=pending.length; shiseiState.done=cursor;
    while(cursor<pending.length){
      if(shiseiState.paused||!navigator.onLine||document.visibilityState!=='visible') break;
      const batch=nextPendingBatch({pending,cursor},SHISEI_BATCH);
      const results=await Promise.allSettled(batch.items.map(item=>{
        const entry=remoteByKey.get(item.key)||shiseiItemEntry(item.key,remoteByKey);
        return entry?fetchShiseiImage(entry).then(data=>{
          const rec={key:item.key,pid:entry.pid,cat:entry.cat,view:entry.view,zh:entry.zh,en:entry.en,ja:entry.ja,data,syncedAt:Date.now()};
          return idb.putShiseiImg(item.key,rec).then(()=>({ok:true,key:item.key,data}));
        }):Promise.reject(new Error('CATALOG_ENTRY_MISSING'));
      }));
      let failed=0, quotaHit=false;
      for(let i=0;i<results.length;i++){
        const item=batch.items[i], out=results[i];
        if(out.status==='fulfilled'&&out.value&&out.value.data){
          imgCache[item.key]=out.value.data;
        } else {
          failed++;
          const reason=out.reason;
          quotaHit=quotaHit||(reason&&(reason.name==='QuotaExceededError'||/quota/i.test(String(reason.message||reason.name||''))));
        }
      }
      cursor=batch.cursor;
      shiseiState.done=cursor;
      meta=mergeShiseiMeta(meta,{cursor,failStreak:(meta.failStreak||0)+failed});
      if(failed>=3) meta.paused=true;
      await idb.putShiseiMeta(SHISEI_META_KEY,meta);
      if(quotaHit) throw Object.assign(new Error('本地空间不足'),{name:'QuotaExceededError'});
      renderShiseiSyncStatus();
      if(meta.paused) break;
      await new Promise(res=>setTimeout(res,30)); // 空闲节流
    }
    if(shiseiState.paused||!navigator.onLine||document.visibilityState!=='visible'){
      await idb.putShiseiMeta(SHISEI_META_KEY,mergeShiseiMeta(meta,{paused:true,checkedAt:Date.now()}));
      shiseiState.paused=true;
    } else {
      await finishShiseiSync(meta);
    }
  }catch(e){
    let meta=await idb.getShiseiMeta(SHISEI_META_KEY);
    const failStreak=((meta&&meta.failStreak)||0)+1;
    meta=mergeShiseiMeta(meta||{},{
      failStreak,checkedAt:Date.now(),
      paused:e&&e.name==='QuotaExceededError'?true:(failStreak>=3?true:(meta&&meta.paused)||false)
    });
    await idb.putShiseiMeta(SHISEI_META_KEY,meta).catch(()=>{});
    if(e&&e.name==='QuotaExceededError') toast('本地空间不足，可在素材来源里清除姿势图库');
    shiseiState.paused=true;
  }finally{
    shiseiState.running=false;
    renderShiseiSyncStatus();
  }
}
function shiseiItemEntry(key,remoteByKey){
  const m=/^shisei:(.*):([^:]*)$/.exec(String(key||''));
  return m?remoteByKey.get(key)||null:null;
}
async function finishShiseiSync(meta){
  await idb.putShiseiMeta(SHISEI_META_KEY,mergeShiseiMeta(meta,{pending:[],cursor:0,checkedAt:Date.now(),paused:false}));
  shiseiState.paused=false;
}
async function renderShiseiSyncStatus(){
  const box=document.getElementById('shiseiSyncBox'); if(!box) return;
  let meta=null, stats={count:0,bytes:0,avg:0};
  try{ meta=await idb.getShiseiMeta(SHISEI_META_KEY); stats=await idb.shiseiImgStats(); }catch(e){}
  let stat='未同步';
  if(!shiseiSyncEnabled()) stat='已暂停';
  else if(shiseiState.running) stat=(shiseiState.paused?'已暂停':'进行中 ')+Math.min(shiseiState.done,shiseiState.total||0)+'/'+(shiseiState.total||0);
  else if(meta&&meta.paused) stat='已暂停';
  else if(meta&&meta.failStreak>=3) stat='连续失败 '+meta.failStreak+' 次';
  else if(meta&&meta.total&&stats.count) stat='已同步 '+stats.count+'/'+meta.total;
  else if(stats.count) stat='已同步 '+stats.count+' 张';
  const mb=(stats.bytes/1024/1024).toFixed(1), kb=(stats.avg/1024).toFixed(1);
  box.innerHTML='<div class="src-sync"><div><b>姿势图库同步</b> <span class="muted">'+esc(stat)+' · '+stats.count+' 张'
    +(stats.count?' · 约 '+mb+' MB（平均 '+kb+' KB）':'')+'</span></div>'
    +'<div class="row" style="margin-top:6px">'
    +'<button class="btn btn-ghost btn-sm" onclick="toggleShiseiSync()">'+(shiseiSyncEnabled()?'暂停':'恢复')+'</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="startShiseiSync(true)">立即同步</button>'
    +(stats.count?'<button class="btn btn-danger btn-sm" onclick="clearShiseiGallery()">清除图库</button>':'')
    +'</div></div>';
}
function toggleShiseiSync(){
  if(shiseiSyncEnabled()){
    try{ localStorage.setItem('wb_sf_shisei_sync','0'); }catch(e){}
    if(shiseiState.running) shiseiState.paused=true;
  } else {
    try{ localStorage.removeItem('wb_sf_shisei_sync'); }catch(e){}
    startShiseiSync(true);
  }
  renderShiseiSyncStatus();
}
function clearShiseiGallery(){
  askConfirm('清除姿势图库？','将删除本机缓存的图库缩略图与同步进度；分镜里已引用的图库图会显示为「图库原图已更新」占位，不会改动分镜数据。',async()=>{
    try{ await idb.clearShisei(); }catch(e){ toast('清除失败'); return; }
    Object.keys(imgCache).forEach(k=>{ if(String(k).startsWith('shisei:')) delete imgCache[k]; });
    shiseiState={running:false,paused:false,total:0,done:0};
    renderShiseiSyncStatus();
    if(view.mode==='project'&&view.tab==='shots') renderShots(cur());
    toast('姿势图库已清除');
  });
}
async function ensureShiseiImage(key){
  if(!String(key||'').startsWith('shisei:')) return imgCache[key]||'';
  if(imgCache[key]) return imgCache[key];
  try{
    const rec=await idb.getShiseiImg(key);
    if(rec&&rec.data){
      imgCache[key]=rec.data;
      document.querySelectorAll('[data-shisei-key]').forEach(el=>{
        if(el.dataset.shiseiKey===key){ const img=el.querySelector('img'); if(img) img.src=rec.data; }
      });
      return rec.data;
    }
  }catch(e){}
  return '';
}
async function ensureShiseiRefs(p){
  const keys=[...new Set(((p&&p.shots)||[]).flatMap(s=>s.refIds||[]).filter(k=>String(k||'').startsWith('shisei:')))];
  for(const k of keys){
    if(imgCache[k]) continue;
    try{ const rec=await idb.getShiseiImg(k); if(rec&&rec.data) imgCache[k]=rec.data; else if(imgCache[k]) delete imgCache[k]; }
    catch(e){}
  }
}

/* ================= Toast ================= */
let toastTimer=null;
function toast(msg,ms){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.innerHTML=esc(msg)+(msg==='发现新版本'?'<button onclick="location.reload()">刷新</button>':'');
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms||2800);
}
